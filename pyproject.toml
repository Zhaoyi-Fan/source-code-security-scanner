[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-code-security-scanner"
version = "2.2.0"
description = "Offline, regex-led source-code security triage with safe text, JSON, and SARIF output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zhaoyi Fan" },
]
keywords = [
  "application-security",
  "secure-code-review",
  "security-scanner",
  "sarif",
  "static-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
color = ["colorama>=0.4.6,<1"]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
]

[project.scripts]
vulnscan = "vulnscan:main"

[project.urls]
Homepage = "https://github.com/Zhaoyi-Fan/source-code-security-scanner"
Issues = "https://github.com/Zhaoyi-Fan/source-code-security-scanner/issues"
Source = "https://github.com/Zhaoyi-Fan/source-code-security-scanner"

[tool.setuptools]
py-modules = ["vulnscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
