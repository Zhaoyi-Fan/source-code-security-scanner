name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Prove dependency-free standalone startup
        run: python -I -S vulnscan.py --test-patterns

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run built-in pattern self-test
        run: python vulnscan.py --test-patterns

      - name: Evaluate rule corpus
        run: python scripts/evaluate_corpus.py

      - name: Validate JSON schema syntax
        run: python -m json.tool schemas/vulnscan-2.2.schema.json

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel without optional dependencies
        run: python -m pip install --no-deps dist/*.whl

      - name: Exercise installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          vulnscan --version
          vulnscan --test-patterns
          python -c "import pathlib, vulnscan; location = pathlib.Path(vulnscan.__file__).resolve(); assert 'site-packages' in location.as_posix(); print(location)"
